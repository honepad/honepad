[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honepad"
version = "0.0.1"
description = "Reserved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sebastien Tardif" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.16.5"]

[project.scripts]
honepad = "honepad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honepad = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
