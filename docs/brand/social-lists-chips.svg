  <text x="48" y="520" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26">Implement methods. Run public tests. Unlock the next level.</text>
  <text x="48" y="580" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">pip install honepad</text>
  <text x="430" y="580" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">honepad start bank_system python3</text>
