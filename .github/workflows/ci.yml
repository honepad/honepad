name: CI

# Tests run on pull_request (and merge_group if a queue is added).
# A green squash of an up-to-date PR is the same tree; do not rebuild
# on push to main. workflow_dispatch is the escape hatch.
on:
  pull_request:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'langs/**'
              - 'problems/**'
              - 'factory/**'
              - 'pyproject.toml'
              - 'requirements-*.txt'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  stealth:
    name: Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Assert launch metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash factory/scripts/assert-stealth.sh honepad/honepad

  lint:
    name: Lint
    needs: [changes]
    if: >-
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --require-hashes -r requirements-lint.txt
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    name: Test (${{ matrix.shard }})
    needs: [changes]
    if: >-
      always() &&
      !startsWith(github.head_ref, 'release-please') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, script, compiled, jvm, stats]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.shard == 'unit' || matrix.shard == 'script' || matrix.shard == 'jvm'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.shard == 'compiled'
        with:
          go-version: "1.26"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: matrix.shard == 'compiled'
        with:
          toolchain: stable
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: matrix.shard == 'script'
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.shard == 'compiled'
        with:
          dotnet-version: "8.0.x"
      - uses: fwilhe2/setup-kotlin@ee9692514da313706b193d808526812102a344e4 # v2.0
        if: matrix.shard == 'jvm'
        with:
          version: "2.1.21"
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        if: matrix.shard == 'compiled'
        with:
          swift-version: "6.0"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: matrix.shard == 'script'
        with:
          sdk: stable
      - uses: coursier/setup-action@9b7939bf01fd1185ce2babe16135168361bf2c62 # v3.0.2
        if: matrix.shard == 'jvm'
        with:
          apps: scala:2.13.16 scalac:2.13.16
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        if: matrix.shard == 'script'
        with:
          version: "1.10"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.shard == 'compiled'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
          key: compile-cache-${{ runner.os }}
      - name: Update apt
        if: matrix.shard != 'unit' && matrix.shard != 'jvm'
        run: sudo apt-get update
      - name: Install script langs
        if: matrix.shard == 'script'
        run: sudo apt-get install -y lua5.4 tcl groovy elixir sbcl clojure
      - name: Install stats langs
        if: matrix.shard == 'stats'
        run: sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite octave
      - name: Install compiled langs
        if: matrix.shard == 'compiled'
        run: sudo apt-get install -y nim gdc gfortran fp-compiler ghc ocaml
      - name: Install GNU Smalltalk
        if: matrix.shard == 'script'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          base=http://archive.ubuntu.com/ubuntu/pool/universe/g/gnu-smalltalk
          ver=3.2.5-1.3ubuntu1
          curl -fsSL -o "$tmp/libgst7.deb" "$base/libgst7_${ver}_amd64.deb"
          curl -fsSL -o "$tmp/gnu-smalltalk-common.deb" "$base/gnu-smalltalk-common_${ver}_all.deb"
          curl -fsSL -o "$tmp/gnu-smalltalk.deb" "$base/gnu-smalltalk_${ver}_amd64.deb"
          sudo apt-get install -y unzip zip libsigsegv2
          sudo dpkg --force-depends -i "$tmp/libgst7.deb" "$tmp/gnu-smalltalk-common.deb" "$tmp/gnu-smalltalk.deb"
          gst --version
      - name: Install PowerShell
        if: matrix.shard == 'script'
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            ver=7.4.6
            curl -fsSL -o /tmp/powershell.deb \
              "https://github.com/PowerShell/PowerShell/releases/download/v${ver}/powershell_${ver}-1.deb_amd64.deb"
            sudo dpkg -i /tmp/powershell.deb
            sudo apt-get install -f -y
          fi
          # shellcheck disable=SC2016
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: |
          python3 -m pip install --require-hashes -r requirements-dev.txt
          python3 -m pip install --no-deps --no-build-isolation -e .
      - name: Install CoffeeScript
        if: matrix.shard == 'script'
        run: |
          npm ci --prefix ci/npm --ignore-scripts
          echo "$PWD/ci/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Pytest shard
        run: |
          set -euo pipefail
          extra=( -n 2 --durations=15 --junitxml=junit-${{ matrix.shard }}.xml )
          if [ "${{ matrix.shard }}" = unit ]; then
            extra+=( --cov=honepad --cov-fail-under=80 --cov-report=term )
          fi
          python3 factory/scripts/ci-pytest-shard.py --run ${{ matrix.shard }} -- "${extra[@]}"
      - uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        if: always()
        continue-on-error: true
        with:
          paths: junit-${{ matrix.shard }}.xml
      # pytest covers the matrix; these are CLI smokes.
      - if: matrix.shard == 'unit'
        run: python3 -m honepad.cli run bank_system --lang python3 --level 4
      - if: matrix.shard == 'unit'
        run: python3 -m honepad.cli run in_memory_database --lang python3 --level 4
      - if: matrix.shard == 'unit'
        run: python3 -m honepad.cli run file_storage --lang python3 --level 4
      - if: matrix.shard == 'unit'
        run: python3 -m honepad.cli run workers --lang python3 --level 3
      - if: matrix.shard == 'compiled'
        run: python3 -m honepad.cli run bank_system --lang go --level 4
      - if: matrix.shard == 'script'
        run: python3 -m honepad.cli run bank_system --lang perl --level 4
      - if: matrix.shard == 'unit'
        run: bash factory/scripts/write-ledger.sh --self-test
      - name: Next job respects human_gate
        if: matrix.shard == 'unit'
        run: python3 factory/scripts/check-human-gate.py

  compat:
    name: Compat (${{ matrix.label }})
    needs: [changes]
    if: >-
      always() &&
      !startsWith(github.head_ref, 'release-please') &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            timeout: 15
            wsl: false
          - os: macos-latest
            label: macos
            timeout: 15
            wsl: false
          - os: windows-2022
            label: windows
            timeout: 15
            wsl: false
          - os: windows-2022
            label: wsl
            timeout: 25
            wsl: true
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !matrix.wsl }}
        with:
          python-version: "3.12"
      - name: Update WSL platform
        if: matrix.wsl
        shell: pwsh
        continue-on-error: true
        run: wsl.exe --update --web-download
      - name: Setup WSL
        if: matrix.wsl
        id: setup_wsl
        continue-on-error: true
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          update: false
          additional-packages: python3 python3-pip python3-venv
      - name: Wait before WSL retry
        if: ${{ matrix.wsl && steps.setup_wsl.outcome == 'failure' }}
        shell: pwsh
        run: Start-Sleep -Seconds 45
      - name: Retry WSL setup
        if: ${{ matrix.wsl && steps.setup_wsl.outcome == 'failure' }}
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          update: false
          additional-packages: python3 python3-pip python3-venv
      - name: Install and test (native)
        if: ${{ !matrix.wsl }}
        env:
          TERM: dumb
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests/test_os_compat.py -q --tb=short
      - name: Install and test (WSL)
        if: matrix.wsl
        shell: wsl-bash {0}
        env:
          TERM: dumb
        run: |
          set -euo pipefail
          python3 -m venv /tmp/honepad-venv
          /tmp/honepad-venv/bin/pip install --require-hashes -r requirements-dev.txt
          /tmp/honepad-venv/bin/pip install --no-deps --no-build-isolation -e .
          /tmp/honepad-venv/bin/python -m pytest tests/test_os_compat.py -q --tb=short

  ci:
    name: CI
    needs: [stealth, lint, test, compat]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Require jobs
        run: |
          set -euo pipefail
          test "${{ needs.stealth.result }}" = success
          for r in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.compat.result }}"; do
            test "$r" = success || test "$r" = skipped
          done
