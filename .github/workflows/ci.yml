name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stealth:
    name: Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Assert stealth
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash factory/scripts/assert-stealth.sh honepad/honepad

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install ruff==0.12.11
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: fwilhe2/setup-kotlin@ee9692514da313706b193d808526812102a344e4 # v2.0
        with:
          version: "2.1.21"
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0"
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable
      - uses: coursier/setup-action@fd1707a76b027efdfb66ca79318b4d29b72e5a02 # v3.0.0
        with:
          apps: scala:2.13.16 scalac:2.13.16
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.10"
      - name: Update apt
        run: sudo apt-get update
      - name: Install script langs
        run: sudo apt-get install -y lua5.4 tcl
      - name: Install stats langs
        run: sudo apt-get install -y r-base r-cran-jsonlite octave
      - name: Install compiled langs
        run: sudo apt-get install -y nim gdc gfortran fp-compiler ghc ocaml
      - name: Install jvm/beam langs
        run: sudo apt-get install -y groovy elixir sbcl clojure
      - name: Install GNU Smalltalk
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          base=http://archive.ubuntu.com/ubuntu/pool/universe/g/gnu-smalltalk
          ver=3.2.5-1.3ubuntu1
          curl -fsSL -o "$tmp/libgst7.deb" "$base/libgst7_${ver}_amd64.deb"
          curl -fsSL -o "$tmp/gnu-smalltalk-common.deb" "$base/gnu-smalltalk-common_${ver}_all.deb"
          curl -fsSL -o "$tmp/gnu-smalltalk.deb" "$base/gnu-smalltalk_${ver}_amd64.deb"
          sudo apt-get install -y unzip zip libsigsegv2
          sudo dpkg --force-depends -i "$tmp/libgst7.deb" "$tmp/gnu-smalltalk-common.deb" "$tmp/gnu-smalltalk.deb"
          gst --version
      - run: python3 -m pip install -e ".[dev]"
      - run: npm install -g coffeescript@2.7.0
      - run: python3 -m pytest
      # pytest covers the matrix; these are CLI smokes.
      - run: python3 -m honepad.cli run bank_system --lang python3 --level 4
      - run: python3 -m honepad.cli run in_memory_database --lang python3 --level 4
      - run: python3 -m honepad.cli run file_storage --lang python3 --level 4
      - run: python3 -m honepad.cli run workers --lang python3 --level 3
      - run: python3 -m honepad.cli run bank_system --lang go --level 4
      - run: python3 -m honepad.cli run bank_system --lang perl --level 4
      - name: Install PowerShell
        run: |
          set -euo pipefail
          if ! command -v pwsh >/dev/null 2>&1; then
            ver=7.4.6
            curl -fsSL -o /tmp/powershell.deb \
              "https://github.com/PowerShell/PowerShell/releases/download/v${ver}/powershell_${ver}-1.deb_amd64.deb"
            sudo dpkg -i /tmp/powershell.deb
            sudo apt-get install -f -y
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - run: bash factory/scripts/write-ledger.sh --self-test
      - name: Next job respects human_gate
        run: |
          python3 - <<'PY'
          import json, subprocess, sys

          state = json.load(open("factory/STATE.json"))
          result = subprocess.run(
              ["bash", "factory/scripts/next-job.sh"], check=False
          )
          if state.get("human_gate"):
              sys.exit(0 if result.returncode == 2 else 1)
          sys.exit(0 if result.returncode == 0 else 1)
          PY

  ci:
    name: CI
    needs: [stealth, lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
      - name: Require jobs
        run: |
          set -euo pipefail
          for r in stealth lint test; do
            echo "$r=${{ needs[format('{0}', 'stealth')].result }}"
          done
          test "${{ needs.stealth.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
