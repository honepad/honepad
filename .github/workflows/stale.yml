name: Stale

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

concurrency:
  group: stale
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stale:
    name: Stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: security
          stale-issue-message: This issue has been idle for 60 days. Comment to keep it open.
          stale-pr-message: This pull request has been idle for 30 days. Comment to keep it open.
          close-issue-message: Closed after 14 more idle days.
          close-pr-message: Closed after 7 more idle days.
