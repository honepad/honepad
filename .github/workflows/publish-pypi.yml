# Publish to PyPI from a version tag that equals pyproject.toml.
# workflow_dispatch is main-only and runs the smoke first.
# Do not add a product compile on push to main.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read version
        run: |
          set -euo pipefail
          ver=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "HONEPAD_VERSION=$ver" >> "$GITHUB_ENV"
      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$HONEPAD_VERSION"
          [ "$tag" = "$ver" ] || { echo "tag $tag != version $ver"; exit 1; }
      - name: Smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_packaging.py tests/test_hidden.py tests/test_session.py -q
          python -m honepad.cli run bank_system --lang python3 --level 4
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Dist names match version
        run: |
          set -euo pipefail
          ver="$HONEPAD_VERSION"
          test -f "dist/honepad-${ver}-py3-none-any.whl"
          test -f "dist/honepad-${ver}.tar.gz"
      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
