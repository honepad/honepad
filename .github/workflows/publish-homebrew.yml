# Rewrite honepad/homebrew-tap from a published GitHub Release sdist.
# Does not compile the product. Soft-skip when the App token is unset.
name: Publish Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semver without tag prefix (e.g. 0.1.0). Empty = latest.
        required: false
        type: string
        default: ""

concurrency:
  group: publish-homebrew-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Update homebrew-tap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            ver="${INPUT_VERSION#v}"
          else
            tag=$(gh release view --json tagName --jq .tagName --repo "${{ github.repository }}")
            ver="${tag#v}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - name: Wait for and hash the release sdist
        id: hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://github.com/honepad/honepad/releases/download/v${{ steps.ver.outputs.version }}/honepad-${{ steps.ver.outputs.version }}.tar.gz"
          python3 scripts/wait_for_release_asset.py \
            --url "$url" \
            --output sdist.tar.gz \
            --deadline-s 480 \
            --interval-s 5 \
            --token "${GH_TOKEN}"
          echo "sha256=$(sha256sum sdist.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Check App credentials
        id: check-key
        run: |
          if [ -z "${{ vars.AUTO_APPROVE_CLIENT_ID }}" ]; then
            echo "AUTO_APPROVE_CLIENT_ID unset, skipping tap push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.check-key.outputs.skip != 'true'
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          owner: honepad
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-key.outputs.skip != 'true'
        with:
          repository: honepad/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
      - name: Rewrite formula and push
        if: steps.check-key.outputs.skip != 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula
          python3 ../scripts/update-homebrew-formula.py \
            --version "${{ steps.ver.outputs.version }}" \
            --sha256 "${{ steps.hash.outputs.sha256 }}" \
            --output Formula/honepad.rb
          git config user.name "honepad-release[bot]"
          git config user.email "321573620+honepad-release[bot]@users.noreply.github.com"
          git add Formula/honepad.rb
          git diff --cached --quiet && exit 0
          git commit -m "honepad ${{ steps.ver.outputs.version }}"
          git push
