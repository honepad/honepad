name: Auto-approve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Same-repo heads only. Approve SebTardif PRs and release-please
    # PRs. GITHUB_TOKEN cannot review a PR it authored, so
    # github-actions[bot] release PRs use the honepad-release App
    # token. App-authored release PRs still use GITHUB_TOKEN.
    # Auto-merge is gated later and still skips release PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (
        (
          github.actor == 'SebTardif' &&
          github.event.pull_request.user.login != 'github-actions[bot]'
        ) ||
        startsWith(github.head_ref, 'release-please') ||
        contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
      )
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event.pull_request.user.login == 'github-actions[bot]'
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - name: Guard paths then approve and auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          paths=$(gh pr diff --name-only "$PR" --repo "$REPO")
          matched=$(echo "$paths" | grep -E \
            '^(\.github/workflows/|factory/scripts/ci-pytest-shard\.py$|factory/CONSTITUTION\.md$|factory/scripts/assert-stealth\.sh$)' \
            || true)
          if [ -n "$matched" ]; then
            echo "Skip approve/auto-merge: protected path in diff:"
            echo "$matched"
            exit 0
          fi
          gh pr review --approve "$PR" --repo "$REPO"
          case "$HEAD_REF" in
            release-please*) echo "Skip auto-merge: release PR"; exit 0 ;;
          esac
          case ",$PR_LABELS," in
            *",autorelease: pending,"*)
              echo "Skip auto-merge: autorelease pending"
              exit 0
              ;;
          esac
          gh pr merge --auto --squash "$PR" --repo "$REPO"
