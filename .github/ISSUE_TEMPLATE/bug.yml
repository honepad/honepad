name: Bug
description: Something does not work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what you saw.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: git SHA, tag, or `pip show honepad`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps
      description: Commands or a short session log.
    validations:
      required: true
